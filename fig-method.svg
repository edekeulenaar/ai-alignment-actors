<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1664" font-family="Test National, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <style>
      .box { fill: #f4f1ea; stroke: #cfc7b8; stroke-width: 1; }
      .box-out { fill: #fffdf8; stroke: #cfc7b8; stroke-width: 1; }
      .step { font-size: 12px; fill: #8a8377; letter-spacing: .08em; }
      .head { font-size: 14px; font-weight: bold; fill: #23211e; }
      .body { font-size: 11.5px; fill: #4a463f; }
      .tool { font-size: 11px; fill: #7a736a; font-style: italic; }
      .flow { stroke: #a9a093; stroke-width: 1.3; fill: none; marker-end: url(#m); }
      .title { font-size: 22px; fill: #23211e; }
      .sub { font-size: 13.5px; fill: #6f6a62; font-style: italic; }
      .count { font-size: 11.5px; fill: #3f6fb5; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9a093"/>
    </marker>
  </defs>

  <text class="title" x="480" y="40" text-anchor="middle">From seed URLs to analysis</text>
  <text class="sub" x="480" y="63" text-anchor="middle">the empirical procedure, and what each step produced</text>

  <!-- 1 -->
  <rect class="box" x="40" y="92" width="272" height="150" rx="6"/>
  <text class="step" x="62" y="120">STEP 1</text>
  <text class="head" x="62" y="142">Document selection from seed URLs</text>
  <text class="body" x="62" y="166">Company index pages: newsrooms,</text>
  <text class="body" x="62" y="183">transparency hubs, model-card indexes,</text>
  <text class="body" x="62" y="200">safety and policy pages</text>
  <text class="count" x="62" y="220">28 seeds · 8 companies</text>

  <!-- 2 -->
  <rect class="box" x="344" y="92" width="272" height="150" rx="6"/>
  <text class="step" x="366" y="120">STEP 2</text>
  <text class="head" x="366" y="142">Crawling and capture</text>
  <text class="body" x="366" y="166">Playwright renders each page, follows</text>
  <text class="body" x="366" y="183">pagination and "load more"; PDFs kept</text>
  <text class="body" x="366" y="200">as published, pages rendered to</text>
  <text class="body" x="366" y="217">paginated PDF + Markdown</text>

  <!-- 3 -->
  <rect class="box" x="648" y="92" width="272" height="150" rx="6"/>
  <text class="step" x="670" y="120">STEP 3</text>
  <text class="head" x="670" y="142">Document types</text>
  <text class="body" x="670" y="166">The study's taxonomy of 21 types:</text>
  <text class="body" x="670" y="183">152 typed when selected, 58 by hand,</text>
  <text class="body" x="670" y="200">the rest by rules on title and URL</text>
  <text class="count" x="670" y="220">1,318 links → 515 documents</text>

  <path class="flow" d="M313,167 L342,167"/>
  <path class="flow" d="M617,167 L646,167"/>
  <path class="flow" d="M784,242 L784,274"/>

  <!-- 4: the index -->
  <rect class="box" x="40" y="276" width="880" height="238" rx="6"/>
  <text class="step" x="64" y="304">STEP 4</text>
  <text class="head" x="64" y="326">The retrieval index (RAG)</text>

  <rect class="box-out" x="64" y="348" width="256" height="142" rx="5"/>
  <text class="head" x="84" y="376" font-size="12.5">Corpus</text>
  <text class="body" x="84" y="398">515 crawled company documents,</text>
  <text class="body" x="84" y="415">184 items from the Zotero library and</text>
  <text class="body" x="84" y="432">53 policy snapshots, their text kept</text>
  <text class="body" x="84" y="449">page by page</text>
  <text class="count" x="84" y="468">752 documents · 13,660 pages</text>

  <rect class="box-out" x="352" y="348" width="256" height="142" rx="5"/>
  <text class="head" x="372" y="376" font-size="12.5">Passages and search</text>
  <text class="body" x="372" y="398">Passages of up to 160 words, 40-word</text>
  <text class="body" x="372" y="415">overlap, never crossing a page. BM25</text>
  <text class="body" x="372" y="432">for exact names, dense embeddings</text>
  <text class="body" x="372" y="449">(bge-base), fused by reciprocal rank</text>
  <text class="count" x="372" y="468">35,265 passages</text>

  <rect class="box-out" x="640" y="348" width="256" height="142" rx="5"/>
  <text class="head" x="660" y="376" font-size="12.5">Retrieval tested</text>
  <text class="body" x="660" y="398">480 queries drawn from the earlier</text>
  <text class="body" x="660" y="415">readings: the right page among the</text>
  <text class="body" x="660" y="432">first five results for 84.2%, among</text>
  <text class="body" x="660" y="449">the first ten for 89.6%</text>

  <path class="flow" d="M321,419 L350,419"/>
  <path class="flow" d="M609,419 L638,419"/>
  <path class="flow" d="M480,514 L480,546"/>

  <!-- 5: reading with the index -->
  <rect class="box" x="40" y="548" width="880" height="444" rx="6"/>
  <text class="step" x="64" y="576">STEP 5</text>
  <text class="head" x="64" y="598">Reading with the index: Claude Opus 5.5, one model throughout</text>

  <rect class="box-out" x="64" y="620" width="400" height="162" rx="5"/>
  <text class="head" x="84" y="648" font-size="12.5">Read every page</text>
  <text class="body" x="84" y="670">Each document read whole from the index's page store,</text>
  <text class="body" x="84" y="687">every page numbered. 55 long documents read in 166</text>
  <text class="body" x="84" y="704">sections of about 22k tokens, each sent with the front</text>
  <text class="body" x="84" y="721">matter and the reference-list pages that BM25 retrieval</text>
  <text class="body" x="84" y="738">and citation density locate in the index</text>
  <text class="count" x="84" y="760">752 documents · 863 readings · 15 re-read once</text>

  <rect class="box-out" x="496" y="620" width="400" height="162" rx="5"/>
  <text class="head" x="516" y="648" font-size="12.5">What is recorded</text>
  <text class="body" x="516" y="670">Definitions of conducts and risks (not mentions) and the</text>
  <text class="body" x="516" y="687">sources credited for them; training methods and who</text>
  <text class="body" x="516" y="704">conceived or took part; benchmarks and who created them;</text>
  <text class="body" x="516" y="721">external evaluators. Each with a verbatim quote and its</text>
  <text class="body" x="516" y="738">page number</text>
  <text class="count" x="516" y="760">3,327 definitions · 2,109 trainings · 3,311 benchmark uses</text>

  <rect class="box-out" x="64" y="806" width="400" height="162" rx="5"/>
  <text class="head" x="84" y="834" font-size="12.5">Check every quote against its page</text>
  <text class="body" x="84" y="856">Each quote looked up on the page it cites in the page</text>
  <text class="body" x="84" y="873">store: verbatim, near-verbatim (≥ 90%), or found on</text>
  <text class="body" x="84" y="890">another page and its page number corrected. Elements</text>
  <text class="body" x="84" y="907">whose quote is on no page of the document are dropped</text>
  <text class="count" x="84" y="946">9,533 kept · 30 quotes and 7 actor links dropped</text>

  <rect class="box-out" x="496" y="806" width="400" height="162" rx="5"/>
  <text class="head" x="516" y="834" font-size="12.5">Check who every actor is</text>
  <text class="body" x="516" y="856">Passages naming each actor retrieved from the index</text>
  <text class="body" x="516" y="873">(BM25) and read with its documents' own descriptions;</text>
  <text class="body" x="516" y="890">a second reading confirms or corrects its type. Works by</text>
  <text class="body" x="516" y="907">authors from institutions of different kinds are</text>
  <text class="body" x="516" y="924">classed as Multiple</text>
  <text class="count" x="516" y="946">1,204 actors · 905 confirmed · 139 corrected · 160 unresolved</text>

  <path class="flow" d="M465,701 L494,701"/>
  <path class="flow" d="M264,783 L264,804"/>
  <path class="flow" d="M696,783 L696,804"/>
  <path class="flow" d="M480,992 L480,1024"/>

  <!-- 6: analyses -->
  <rect class="box" x="40" y="1026" width="880" height="618" rx="6"/>
  <text class="step" x="64" y="1054">STEP 6</text>
  <text class="head" x="64" y="1076">Analyses</text>

  <rect class="box-out" x="64" y="1098" width="400" height="164" rx="5"/>
  <text class="head" x="84" y="1126" font-size="12.5">Enrolment across the stack</text>
  <text class="body" x="84" y="1148">For every checked actor, whether a document credits it</text>
  <text class="body" x="84" y="1165">as a source of the definition of a conduct or risk, with</text>
  <text class="body" x="84" y="1182">conceiving or taking part in training, with creating a</text>
  <text class="body" x="84" y="1199">benchmark, or with evaluating or red-teaming a model,</text>
  <text class="body" x="84" y="1216">by company and by year</text>
  <text class="tool" x="84" y="1240">→ Figures 6a, 6b, 7, 8 and 9</text>

  <rect class="box-out" x="496" y="1098" width="400" height="164" rx="5"/>
  <text class="head" x="516" y="1126" font-size="12.5">Exclusion</text>
  <text class="body" x="516" y="1148">A directory of 512 value-alignment organisations, built</text>
  <text class="body" x="516" y="1165">from validated search results in three languages and four</text>
  <text class="body" x="516" y="1182">countries, compared against the checked actors to ask</text>
  <text class="body" x="516" y="1199">which kinds of actor cross into company documents</text>
  <text class="body" x="516" y="1216">and which remain outside</text>
  <text class="tool" x="516" y="1240">→ Figure 10</text>

  <rect class="box-out" x="64" y="1286" width="256" height="144" rx="5"/>
  <text class="head" x="84" y="1314" font-size="12.5">Discourse per type</text>
  <text class="body" x="84" y="1336">Noun chunks scored by log-odds with</text>
  <text class="body" x="84" y="1353">an informative prior, against the rest</text>
  <text class="body" x="84" y="1370">of the corpus; concepts only, and only</text>
  <text class="body" x="84" y="1387">where more than one company uses them.</text>
  <text class="tool" x="84" y="1410">→ Figure 2</text>

  <rect class="box-out" x="352" y="1286" width="256" height="144" rx="5"/>
  <text class="head" x="372" y="1314" font-size="12.5">Document network</text>
  <text class="body" x="372" y="1336">An edge where one document names</text>
  <text class="body" x="372" y="1353">another by title or links to it; links</text>
  <text class="body" x="372" y="1370">a company repeats across its own</text>
  <text class="body" x="372" y="1387">pages are discounted as navigation.</text>
  <text class="tool" x="372" y="1410">→ Figure 3a</text>

  <rect class="box-out" x="640" y="1286" width="256" height="144" rx="5"/>
  <text class="head" x="660" y="1314" font-size="12.5">Actors per document type</text>
  <text class="body" x="660" y="1336">The checked actors and their roles,</text>
  <text class="body" x="660" y="1353">counted by document type. The</text>
  <text class="body" x="660" y="1370">authoring company is not an actor</text>
  <text class="body" x="660" y="1387">in its own documents.</text>
  <text class="tool" x="660" y="1410">→ Figures 3b and 4</text>

  <rect class="box-out" x="64" y="1454" width="400" height="166" rx="5"/>
  <text class="head" x="84" y="1482" font-size="12.5">Conceptual change</text>
  <text class="body" x="84" y="1504">3,152 names of conducts and risks harmonised into 1,233</text>
  <text class="body" x="84" y="1521">concepts. For each company, a concept's definitions are</text>
  <text class="body" x="84" y="1538">compared year by year, word by word, with the closest</text>
  <text class="body" x="84" y="1555">earlier definition</text>
  <text class="tool" x="84" y="1598">→ conceptual change in Figures 6a and 6b; Further figures</text>

  <rect class="box-out" x="496" y="1454" width="400" height="166" rx="5"/>
  <text class="head" x="516" y="1482" font-size="12.5">Statements about AI</text>
  <text class="body" x="516" y="1504">2,162 candidate sentences with AI as their subject,</text>
  <text class="body" x="516" y="1521">taken from every page of the index. Claude Opus 5.5</text>
  <text class="body" x="516" y="1538">keeps those that define AI or speculate about it and</text>
  <text class="body" x="516" y="1555">marks those about risks; each is kept verbatim</text>
  <text class="count" x="516" y="1576">753 statements · 312 about risks</text>
  <text class="tool" x="516" y="1598">→ word tree, Further figures</text>
</svg>
