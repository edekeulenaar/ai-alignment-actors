<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 974" font-family="Test National, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <style>
      .box { fill: #f4f1ea; stroke: #cfc7b8; stroke-width: 1; }
      .num { fill: #fffdf8; stroke: #cfc7b8; stroke-width: 1; }
      .n { font-size: 17px; fill: #8a8377; text-anchor: middle; }
      .head { font-size: 19px; font-weight: bold; fill: #23211e; }
      .body { font-size: 15.5px; fill: #4a463f; }
      .flow { stroke: #a9a093; stroke-width: 1.4; fill: none; marker-end: url(#m); }
      .title { font-size: 25px; fill: #23211e; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9a093"/>
    </marker>
  </defs>

  <text class="title" x="480" y="48" text-anchor="middle">From seed URLs to analysis</text>


  <rect class="box" x="40" y="84" width="880" height="104" rx="6"/>
  <circle class="num" cx="86" cy="136" r="20"/><text class="n" x="86" y="142">1</text>
  <text class="head" x="130" y="120">Selecting 28 seed URLs from 8 AI companies</text>
  <text class="body" x="130" y="146">Newsrooms, transparency hubs, model-card indexes and safety pages</text>
  <path class="flow" d="M480,188 L480,208"/>

  <rect class="box" x="40" y="210" width="880" height="104" rx="6"/>
  <circle class="num" cx="86" cy="262" r="20"/><text class="n" x="86" y="268">2</text>
  <text class="head" x="130" y="246">Crawling 1,318 links into 515 documents</text>
  <text class="body" x="130" y="272">Rendering each page with Playwright and following pagination;</text>
  <text class="body" x="130" y="293">keeping PDFs as published</text>
  <path class="flow" d="M480,314 L480,334"/>

  <rect class="box" x="40" y="336" width="880" height="104" rx="6"/>
  <circle class="num" cx="86" cy="388" r="20"/><text class="n" x="86" y="394">3</text>
  <text class="head" x="130" y="372">Categorising the documents into 21 types</text>
  <text class="body" x="130" y="398">Assigning each type at selection, by hand, or by rules on title and URL</text>
  <path class="flow" d="M480,440 L480,460"/>

  <rect class="box" x="40" y="462" width="880" height="104" rx="6"/>
  <circle class="num" cx="86" cy="514" r="20"/><text class="n" x="86" y="520">4</text>
  <text class="head" x="130" y="498">Indexing 752 documents for retrieval (RAG)</text>
  <text class="body" x="130" y="524">Adding Zotero items and policies; splitting 13,660 pages into 35,265 passages</text>
  <text class="body" x="130" y="545">searchable by keyword and by meaning</text>
  <path class="flow" d="M480,566 L480,586"/>

  <rect class="box" x="40" y="588" width="880" height="104" rx="6"/>
  <circle class="num" cx="86" cy="640" r="20"/><text class="n" x="86" y="646">5</text>
  <text class="head" x="130" y="624">Extracting data points with Claude Opus 5.5</text>
  <text class="body" x="130" y="650">Reading each document from the index; recording definitions of conducts and risks,</text>
  <text class="body" x="130" y="671">training methods, benchmarks, credited actors and dates, each with its quote and page</text>
  <path class="flow" d="M480,692 L480,712"/>

  <rect class="box" x="40" y="714" width="880" height="104" rx="6"/>
  <circle class="num" cx="86" cy="766" r="20"/><text class="n" x="86" y="772">6</text>
  <text class="head" x="130" y="750">Checking what is recorded</text>
  <text class="body" x="130" y="776">Matching every quote to its page; checking each actor against the passages</text>
  <text class="body" x="130" y="797">that name it in the index</text>
  <path class="flow" d="M480,818 L480,838"/>

  <rect class="box" x="40" y="840" width="880" height="104" rx="6"/>
  <circle class="num" cx="86" cy="892" r="20"/><text class="n" x="86" y="898">7</text>
  <text class="head" x="130" y="876">Analysing who takes part, and where</text>
  <text class="body" x="130" y="902">Counting credited actors by stage, company, document type and year;</text>
  <text class="body" x="130" y="923">comparing definitions over time</text>
</svg>
