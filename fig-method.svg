<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 724" font-family="Test National, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <style>
      .box { fill: #f4f1ea; stroke: #cfc7b8; stroke-width: 1; }
      .step { font-size: 12.5px; fill: #8a8377; letter-spacing: .08em; }
      .head { font-size: 17px; font-weight: bold; fill: #23211e; }
      .body { font-size: 14px; fill: #4a463f; }
      .count { font-size: 14px; fill: #3f6fb5; }
      .flow { stroke: #a9a093; stroke-width: 1.4; fill: none; marker-end: url(#m); }
      .title { font-size: 24px; fill: #23211e; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9a093"/>
    </marker>
  </defs>

  <text class="title" x="480" y="46" text-anchor="middle">From seed URLs to analysis</text>


  <rect class="box" x="40" y="84" width="272" height="190" rx="6"/>
  <text class="step" x="62" y="114">STEP 1</text>
  <text class="head" x="62" y="138">Selecting seed URLs</text>
  <text class="body" x="62" y="164">Company index pages: newsrooms,</text>
  <text class="body" x="62" y="183">transparency hubs, model-card</text>
  <text class="body" x="62" y="202">and safety pages</text>
  <text class="count" x="62" y="254">28 seeds · 8 companies</text>

  <rect class="box" x="344" y="84" width="272" height="190" rx="6"/>
  <text class="step" x="366" y="114">STEP 2</text>
  <text class="head" x="366" y="138">Crawling the seeds</text>
  <text class="body" x="366" y="164">Rendering pages with Playwright,</text>
  <text class="body" x="366" y="183">following pagination; keeping</text>
  <text class="body" x="366" y="202">PDFs as published</text>
  <text class="count" x="366" y="254">1,318 links → 515 documents</text>

  <rect class="box" x="648" y="84" width="272" height="190" rx="6"/>
  <text class="step" x="670" y="114">STEP 3</text>
  <text class="head" x="670" y="138">Categorising by type</text>
  <text class="body" x="670" y="164">Assigning one of 21 types at</text>
  <text class="body" x="670" y="183">selection, by hand, or by rules</text>
  <text class="body" x="670" y="202">on title and URL</text>
  <text class="count" x="670" y="254">21 types</text>

  <rect class="box" x="40" y="330" width="272" height="190" rx="6"/>
  <text class="step" x="62" y="360">STEP 4</text>
  <text class="head" x="62" y="384">Indexing for retrieval (RAG)</text>
  <text class="body" x="62" y="410">Adding Zotero items and policies;</text>
  <text class="body" x="62" y="429">splitting pages into passages</text>
  <text class="body" x="62" y="448">searchable by keyword and meaning</text>
  <text class="count" x="62" y="500">752 documents · 35,265 passages</text>

  <rect class="box" x="344" y="330" width="272" height="190" rx="6"/>
  <text class="step" x="366" y="360">STEP 5</text>
  <text class="head" x="366" y="384">Extracting data points</text>
  <text class="body" x="366" y="410">Claude Opus 5.5 reads each</text>
  <text class="body" x="366" y="429">document from the index, recording</text>
  <text class="body" x="366" y="448">conducts, risks, training, benchmarks,</text>
  <text class="body" x="366" y="467">actors and dates with their quotes</text>
  <text class="count" x="366" y="500">863 readings</text>

  <rect class="box" x="648" y="330" width="272" height="190" rx="6"/>
  <text class="step" x="670" y="360">STEP 6</text>
  <text class="head" x="670" y="384">Checking what is recorded</text>
  <text class="body" x="670" y="410">Matching every quote to its page;</text>
  <text class="body" x="670" y="429">checking each actor against the</text>
  <text class="body" x="670" y="448">passages naming it in the index</text>
  <text class="count" x="670" y="500">9,533 elements · 1,204 actors</text>

  <rect class="box" x="40" y="576" width="880" height="124" rx="6"/>
  <text class="step" x="62" y="606">STEP 7</text>
  <text class="head" x="62" y="630">Analysing who takes part, and where</text>
  <text class="body" x="62" y="656">Counting credited actors by stage, company, document type and year; comparing definitions over time</text>
  <text class="count" x="62" y="680">Figures 2–4 and 6–10</text>
  <path class="flow" d="M313,179 L342,179"/>
  <path class="flow" d="M617,179 L646,179"/>
  <path class="flow" d="M313,425 L342,425"/>
  <path class="flow" d="M617,425 L646,425"/>
  <path class="flow" d="M784,274 L784,302 L176,302 L176,328"/>
  <path class="flow" d="M784,520 L784,574"/>
</svg>
